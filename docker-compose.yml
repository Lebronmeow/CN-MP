services:
  firewall:
    build:
      context: ./firewall
      dockerfile: Dockerfile
    container_name: lab_firewall
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      - LAB_MODE=${LAB_MODE:-A}
    volumes:
      - ./firewall/rules:/opt/firewall/rules
      - fw_run:/var/run/firewall
    networks:
      client_net:
        ipv4_address: 192.168.1.254
      web_net:
        ipv4_address: 10.0.1.254
      app_net:
        ipv4_address: 10.0.2.254
      db_net:
        ipv4_address: 10.0.3.254
    restart: unless-stopped

  sniffer:
    build:
      context: ./sniffer
      dockerfile: Dockerfile
    container_name: lab_sniffer
    network_mode: "service:firewall"
    depends_on:
      - firewall
    volumes:
      - ./captures:/captures
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: lab_client
    cap_add:
      - NET_ADMIN
    depends_on:
      - firewall
    networks:
      client_net:
        ipv4_address: 192.168.1.20
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: lab_web
    cap_add:
      - NET_ADMIN
    depends_on:
      - firewall
    networks:
      web_net:
        ipv4_address: 10.0.1.10
    restart: unless-stopped

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: lab_app
    cap_add:
      - NET_ADMIN
    depends_on:
      - firewall
    networks:
      app_net:
        ipv4_address: 10.0.2.10
    restart: unless-stopped

  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: lab_db
    cap_add:
      - NET_ADMIN
    depends_on:
      - firewall
    networks:
      db_net:
        ipv4_address: 10.0.3.10
    restart: unless-stopped

networks:
  client_net:
    name: client_net
    internal: true
    ipam:
      config:
        - subnet: 192.168.1.0/24
  web_net:
    name: web_net
    internal: true
    ipam:
      config:
        - subnet: 10.0.1.0/24
  app_net:
    name: app_net
    internal: true
    ipam:
      config:
        - subnet: 10.0.2.0/24
  db_net:
    name: db_net
    internal: true
    ipam:
      config:
        - subnet: 10.0.3.0/24

volumes:
  fw_run:
