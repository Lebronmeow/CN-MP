# Web Tier - Nginx Reverse Proxy Configuration
# Manages public ingress, handles HTTP/HTTPS, security headers, and routes /api/ to App Tier

upstream app_tier {
    server app:5000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name localhost;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Tier-Identity "Web-Tier-01" always;

    # Root for static frontend files (HTML, CSS, JS)
    root /usr/share/nginx/html;
    index index.html;

    # Serve static frontend files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API requests to Application Tier (Flask on port 5000)
    location /api/ {
        proxy_pass http://app_tier;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Web-Tier "Nginx-Reverse-Proxy (10.0.1.10)";

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Explicit Security Checkpoint: Block any attempt to reach Database tier or port 3306 through Web
    location ~* /(mysql|db|3306) {
        default_type application/json;
        return 403 '{"error": "Firewall Deny: Direct access to Database tier is forbidden by 3-tier security policy"}';
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
